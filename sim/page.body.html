<div class="wrap">
  <div class="top">
    <h1>credits engine simulator</h1>
    <div class="meta"><span id="runinfo">starting</span> <button id="themeToggle" type="button" aria-label="switch theme">theme: auto</button></div>
  </div>
  <div id="verdict" class="verdict" role="status" aria-live="polite">
    <div class="v1" id="v1">running the calibrated base case</div>
    <div class="v2" id="v2"></div>
  </div>
  <div class="layout">
    <aside class="controls" aria-label="controls">
      <div class="btnrow">
        <button id="reset" type="button" class="primary">reset to as launched</button>
      </div>
      <div class="scen" id="scenarios"><span class="lab">named scenarios from the analysis</span></div>
      <div id="ctlRoot"></div>
    </aside>
    <main class="main">
      <section class="panel" aria-label="headline numbers">
        <h2><span>headline numbers</span><span id="tblnote"></span></h2>
        <div class="scroll"><table id="tbl"></table></div>
        <div class="notes" id="notes"></div>
      </section>
      <section class="charts" id="charts" aria-label="charts"></section>
      <section class="panel" aria-label="calibration">
        <h2><span>calibration data embedded in the model</span><span>13 days, whole life of the collection</span></h2>
        <div class="calib">
          <div class="chart" style="border:0"><h3>daily swap volume of the comparable coin, eth</h3><div class="legend" id="calLegend"></div><canvas id="calChart" height="200" aria-label="comparable daily volume against the model"></canvas></div>
          <div class="scroll"><table id="calTbl"></table></div>
        </div>
      </section>
    </main>
  </div>
</div>
