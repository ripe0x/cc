# Per-change checks. `changes` reads the changed paths, the web and contracts jobs run only when
# their paths changed, and `ci-ok` always reports: it is the one required status check, and it
# passes when every job succeeded or was skipped.
# Contract changes run a bounded smoke selection plus changed test files. Tools use offline checks.
# The full suite, deployment rehearsal and deep invariants run in the candidate workflow.
# Fork fixtures use the live fixture pin, after the live Core.
# UPSTREAM_RPC_URL is the repo secret FORK_URL when set, else public Tenderly. foundry-toolchain saves foundry's rpc cache.
name: ci

on:
  pull_request:
  push:
    branches: [main, points/v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      contracts: ${{ steps.diff.outputs.contracts }}
      tests: ${{ steps.diff.outputs.tests }}
      tools: ${{ steps.diff.outputs.tools }}
      smoke: ${{ steps.diff.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a push that opens a branch has an all-zero `before`; compare with the parent commit
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "web=$(has '^(web/|keeper/|indexer/|packages/|package\.json$|package-lock\.json$|\.github/workflows/(ci|web)\.yml$)')" >> "$GITHUB_OUTPUT"
          contract_paths='^(src/|test/|lib/|foundry\.toml$|foundry\.lock$|remappings\.txt$|\.gitmodules$|script/.*\.sol$|script/config/|script/deploy\.sh$|script/dev/.*\.sh$|script/tools/check-preflight\.sh$|\.github/workflows/ci\.yml$)'
          echo "contracts=$(has "$contract_paths")" >> "$GITHUB_OUTPUT"
          # Test-only edits run those tests. Shared source/fixture/config changes always get smoke coverage,
          # even when the author changed no .t.sol file. This is bounded coverage, not full release proof.
          non_test_files=$(printf '%s\n' "$files" | grep -Ev '^test/.*\.t\.sol$' || true)
          echo "smoke=$(printf '%s\n' "$non_test_files" | grep -Eq "$contract_paths" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tools=$(has '^(script/|\.github/workflows/.*\.yml$)')" >> "$GITHUB_OUTPUT"
          tests=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'test/*.t.sol' 'test/**/*.t.sol' | sort -u | tr '\n' ' ')
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: offline approval wrapper tests
        run: |
          for test in script/tools/test-*.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 "$test"
          done
      - name: shell syntax
        run: find script -type f -name '*.sh' -print0 | xargs -0 -r -n 1 bash -n
      - name: resume owner guards
        run: bash script/tools/test-resume-owner.sh

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_RPC_URL: ${{ secrets.FORK_URL || 'https://mainnet.gateway.tenderly.co' }}
      MAINNET_RPC_URL: http://127.0.0.1:8545
      FORK_BLOCK: "26208025"
      RPC_FORK_BLOCK: "26251200"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      # compiler cache: a restored out/ and cache/ make the build incremental
      - uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-${{ hashFiles('src/**', 'test/**', 'script/**') }}
          restore-keys: forge-${{ hashFiles('foundry.toml', 'foundry.lock', 'remappings.txt') }}-
      # The RPC snapshot must reach the newest explicit test pin; FORK_BLOCK keeps legacy fixture inputs unchanged.
      - name: mainnet fork anvil
        run: |
          nohup anvil --fork-url "$UPSTREAM_RPC_URL" --fork-block-number "$RPC_FORK_BLOCK" --chain-id 31337 --port 8545 \
            --auto-impersonate --retries 10 --timeout 60000 > anvil.log 2>&1 &
          for _ in $(seq 1 60); do cast chain-id --rpc-url "$MAINNET_RPC_URL" >/dev/null 2>&1 && break; sleep 1; done
          cast chain-id --rpc-url "$MAINNET_RPC_URL"
      # forge test compiles with the configured production restrictions; no duplicate build.
      - name: focused contract checks
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
          SMOKE: ${{ needs.changes.outputs.smoke }}
        run: |
          selected=()
          if [ "$SMOKE" = true ] || [ -z "${TESTS// /}" ]; then
            selected+=(test/{CoreUnit,Config,BuildIdentity,CoreLayout,OwnerPowers,ScriptLint}.t.sol)
          fi
          for f in $TESTS; do selected+=("$f"); done
          # One invocation, including overlap between changed tests and the smoke selection only once.
          selection=$(printf '%s\n' "${selected[@]}" | sort -u | paste -sd, -)
          if [[ "$selection" == *,* ]]; then selection="{$selection}"; fi
          forge test --match-path "$selection" -vv --chain-id 1
      - name: indexer ABI pins
        run: |
          node indexer/scripts/gen-abis.mjs
          git diff --exit-code -- indexer/abis

  ci-ok:
    if: always()
    needs: [changes, web, contracts, tools]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.web.result }} ${{ needs.contracts.result }} ${{ needs.tools.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a job ended $r"; exit 1 ;;
            esac
          done
          echo "all jobs succeeded or were skipped"
