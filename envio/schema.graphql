# Entities mirror indexer/ponder.schema.ts table for table. Differences are listed in README.md.

enum CreditState {
  outside
  held
  composed
  sold
  swapped_out
  migrated
}

enum AcquiredHow {
  eth_bid
  balance_bid
  listing
  adopted
  swap_in
}

enum StatementState {
  outside
  held
  sold
  redeemed
}

enum ComposeMode {
  default
  chosen
}

enum ActivityKind {
  credit_bought
  credit_adopted
  listing_bought
  credit_swapped
  composed
  restyled
  statement_sold
  credit_sold
  redeemed
  buyback
  fees_added
  funded
  escrow_collected
}

enum TreasuryEventKind {
  statement_converted
  cc_redeemed
  claims_funded
  claims_allocated
  claims_returned
  working_withdrawn
  policy_set
  fee_set
  switches_set
  contribution_set
  minimum_working_set
  payment_accrued
  owed_claimed
  migrated_out
  migration_received
  bid_fill
  swept
  allocated
  unallocated
  redeemer_registered
  redeemer_caps_set
  redeemer_switched
  shares_set
  claim_released
  cushion_set
  paused_set
  bid_set
  drawn
}

type Log @index(fields: ["contract", "event", "blockNumber"]) {
  id: ID!
  address: String!
  contract: String!
  event: String!
  args: Json!
  txFrom: String
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  txHash: String!
  logIndex: Int!
}

